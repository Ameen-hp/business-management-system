<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-gray-900">Customer Login</h1>
      <p class="mt-2 text-sm text-gray-500">Sign in to browse products and manage your orders.</p>
    </div>

    <form (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="mb-2 block text-sm font-medium text-gray-700"> Login ID </label>
        <input
          [(ngModel)]="loginId"
          name="loginId"
          required
          autocomplete="username"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-indigo-500"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-gray-700"> Password </label>
        <div class="flex rounded-lg border border-gray-300 focus-within:border-indigo-500">
          <input
            [(ngModel)]="password"
            name="password"
            required
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            class="min-w-0 flex-1 rounded-lg px-4 py-3 outline-none"
          />
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="px-3 text-sm text-indigo-600"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <p *ngIf="error" class="rounded-lg bg-red-50 p-3 text-sm text-red-700">
        {{ error }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700 disabled:bg-gray-300"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
