<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur-md">
  <div class="flex h-25 items-center justify-between gap-3 px-8 sm:px-6">
    <!-- Left: Brand -->
    <div class="flex min-w-0 items-center gap-3">
      <!-- Mobile sidebar toggle -->
      <button
        type="button"
        class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 text-slate-600 transition hover:bg-slate-100 md:hidden"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen"
        aria-label="Toggle navigation menu"
      >
        @if (sidebarOpen) {
          <span class="text-xl">✕</span>
        } @else {
          <span class="text-xl">☰</span>
        }
      </button>

      <!-- Logo -->
      <a routerLink="/admin/dashboard" class="flex min-w-0 items-center gap-3">
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-700 text-xl text-white shadow-sm"
        >
          <span aria-hidden="true">▦</span>
        </div>

        <div class="min-w-0">
          <h1 class="truncate text-base font-bold tracking-tight text-slate-900 sm:text-lg">
            Business Manager
          </h1>
          <p class="hidden text-xs text-slate-500 sm:block">Business Management System</p>
        </div>
      </a>
    </div>

    <!-- Right: Actions -->
    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
      <!-- Workspace label -->
      <div class="hidden items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 lg:flex">
        <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
        <span class="text-xs font-medium text-slate-600">Admin Workspace</span>
      </div>

      <!-- Notifications -->
      <button
        type="button"
        class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-600 transition hover:bg-slate-100"
        aria-label="Notifications"
        title="Notifications"
        (click)="toggleNotifications()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
          <path d="M10 21h4" />
        </svg>

        @if (notificationsOpen) {
          <span
            class="absolute right-1 top-1 h-2.5 w-2.5 rounded-full border-2 border-white bg-blue-600"
          ></span>
        }
      </button>

      <!-- Profile dropdown -->
      <div class="relative">
        <button
          type="button"
          class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-1.5 pr-2.5 transition hover:bg-slate-50"
          (click)="toggleProfile()"
          [attr.aria-expanded]="profileOpen"
          aria-label="Open profile menu"
        >
          <span
            class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-100 text-sm font-bold text-blue-800"
          >
            A
          </span>

          <span class="hidden text-left sm:block">
            <span class="block text-sm font-semibold text-slate-800">Administrator</span>
            <span class="block text-xs text-slate-500">System Admin</span>
          </span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="hidden text-slate-400 sm:block"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (profileOpen) {
          <div
            class="absolute right-0 top-full mt-2 w-56 rounded-xl border border-slate-200 bg-white p-2 shadow-xl"
          >
            <div class="border-b border-slate-100 px-3 py-3">
              <p class="text-sm font-semibold text-slate-800">Administrator</p>
              <p class="mt-1 text-xs text-slate-500">System Admin</p>
            </div>

            <a
              routerLink="/admin/profile"
              (click)="profileOpen = false"
              class="mt-1 block rounded-lg px-3 py-2.5 text-sm text-slate-600 transition hover:bg-slate-50 hover:text-blue-700"
            >
              My Profile
            </a>

            <button
              type="button"
              (click)="logout()"
              class="w-full rounded-lg px-3 py-2.5 text-left text-sm font-medium text-red-600 transition hover:bg-red-50"
            >
              Sign Out
            </button>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- Notification panel -->
  @if (notificationsOpen) {
    <div
      class="absolute right-4 top-full mt-2 w-[min(340px,calc(100vw-2rem))] rounded-xl border border-slate-200 bg-white p-4 shadow-xl sm:right-6"
    >
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-900">Notifications</h2>
        <button
          type="button"
          class="text-xs font-medium text-blue-700 hover:text-blue-900"
          (click)="notificationsOpen = false"
        >
          Close
        </button>
      </div>

      <p class="mt-3 rounded-lg bg-slate-50 p-3 text-sm text-slate-600">
        Your notification panel is ready. Connect it to your backend to show real order, inventory,
        and shipment alerts.
      </p>
    </div>
  }
</header>
