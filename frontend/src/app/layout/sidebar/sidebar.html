<aside
  class="flex h-full min-h-full w-64 flex-col bg-slate-900 text-slate-200 sm:flex justify-center"
>
  <!-- Sidebar Heading -->
  <div class="border-b border-slate-700 px-6 py-5">
    <h2 class="text-lg font-bold text-white">
      {{ sidebarTitle }}
    </h2>

    <p class="mt-1 text-xs text-slate-400">
      {{ sidebarDescription }}
    </p>
  </div>

  <!-- Dynamic Navigation -->
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-5">
    @for (section of sidebarSections; track section.title) {
      <p
        class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400"
        [class.mt-7]="section.title !== 'Main Menu'"
      >
        {{ section.title }}
      </p>

      @for (item of section.items; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-blue-600 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm transition hover:bg-slate-800"
        >
          <span>{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    }
  </nav>

  <!-- Sidebar Bottom -->
  <div class="border-t border-slate-700 px-6 py-4">
    <p class="text-xs text-slate-400">
      {{ footerTitle }}
    </p>

    <p class="mt-1 text-xs text-slate-500">
      {{ footerDescription }}
    </p>
  </div>
</aside>
