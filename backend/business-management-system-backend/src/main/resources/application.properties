
# Application
spring.application.name=business-management-system-backend
server.port=8081

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BMS;encrypt=true;trustServerCertificate=true
spring.datasource.username=BussnuissManager
spring.datasource.password=${DB_PASSWORD:BMS123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=dbo

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.root=INFO
logging.level.com.businessmanagementsystem=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
